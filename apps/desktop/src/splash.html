<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>DSH Starter</title>
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body {
    display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 0%, #1a2233 0%, #0e1116 60%);
    color: #e6ebf3;
    font: 14px/1.6 -apple-system, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  main { text-align: center; max-width: 460px; padding: 32px }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 22px;
    border-radius: 18px;
    background: linear-gradient(145deg, #2f6df6, #7c4dff);
    box-shadow: 0 18px 40px rgba(47, 109, 246, .35);
    display: grid; place-items: center;
  }
  .mark svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
  h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; letter-spacing: .2px }
  p { margin: 0; color: #8a93a3; font-size: 12.5px }
  .dots { display: inline-flex; gap: 5px; margin-top: 22px }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #2f6df6; opacity: .25; animation: pulse 1.2s infinite }
  .dots i:nth-child(2) { animation-delay: .18s }
  .dots i:nth-child(3) { animation-delay: .36s }
  @keyframes pulse { 0%, 100% { opacity: .2; transform: translateY(0) } 45% { opacity: 1; transform: translateY(-3px) } }
  code { font: 11.5px ui-monospace, Menlo, monospace; color: #6f7a8c }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v6a2.5 2.5 0 0 1-2.5 2.5H9l-5 4z"/>
      <path d="M8.5 10.5h7M8.5 13h4"/>
    </svg>
  </div>
  <h1><!-- MESSAGE --></h1>
  <p>官方 dsh web 正在装配插件树，就绪后会自动进入界面。</p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <p style="margin-top:26px"><code>官方 Host · 未改动一行源码</code></p>
</main>
</body>
</html>
